      <circle cx="560" cy="300" r="14"/>
      <circle cx="600" cy="470" r="14"/>
      <circle cx="430" cy="500" r="11" fill-opacity="0.7"/>
      <circle cx="760" cy="360" r="11" fill-opacity="0.7"/>
